<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Atur Kata Sandi - MTC</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <main class="auth-shell">
        <header class="auth-header">
            <h1>ATUR KATA SANDI</h1>
        </header>
        <section class="auth-card">
            <p>Gunakan tautan satu kali dari email Anda untuk membuat kata sandi MTC.</p>
            <form id="setup-form">
                <div class="form-group">
                    <label for="password">Kata sandi baru</label>
                    <input class="pill-input" id="password" name="password" type="password"
                        minlength="6" maxlength="1024" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Ulangi kata sandi</label>
                    <input class="pill-input" id="confirm-password" name="confirm-password" type="password"
                        minlength="6" maxlength="1024" autocomplete="new-password" required>
                </div>
                <button class="btn-3d" id="submit-button" type="submit">SIMPAN KATA SANDI</button>
            </form>
            <p class="status-box" id="status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script type="module" src="./setup-password.js"></script>
</body>
</html>
