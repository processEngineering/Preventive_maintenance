<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Persetujuan Aktivasi - MTC</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <main class="auth-shell">
        <header class="auth-header">
            <h1>PERSETUJUAN AKTIVASI</h1>
        </header>
        <section class="auth-card">
            <p>Setujui hanya jika Anda sudah memverifikasi pemohon dan profil MTC yang sesuai.</p>
            <button class="btn-3d" id="approve-button" type="button" disabled>
                SETUJUI DAN KIRIM TAUTAN SETUP
            </button>
            <p class="status-box" id="status" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script type="module" src="./approve-activation.js"></script>
</body>
</html>
