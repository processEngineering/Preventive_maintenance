<!-- index.html -->

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKG Maintenance</title>
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AKG Maintenance">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./assets/images/akg-icon.png">
    <link rel="apple-touch-icon" href="./assets/images/akg-icon.png">
</head>
<body>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service worker registered'))
                    .catch((error) => console.error('Service worker registration failed:', error));
            });
        }
    </script>

    <script>
        window.location.replace('./view/auth.html?mode=login');
    </script>
</body>
</html>
