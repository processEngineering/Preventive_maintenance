<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arsip Data - AKG Maintenance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #c91919;
            --primary-dark: #a50e0e;
            --bg-body: #f8f9fa;
            --text-dark: #333333;
            --sidebar-width: 280px;
            --header-height: 80px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-body); min-height: 100vh; color: var(--text-dark); overflow-x: hidden; }

        /* --- Header & Sidebar --- */
        .main-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .header-content-wrapper { width: 100%; max-width: 1200px; display: flex; align-items: center; padding: 0 20px; position: relative; }
        .hamburger-menu { font-size: 26px; color: var(--primary); cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: flex-start; z-index: 2; }
        .header-title-pill { border: 2px solid var(--primary); color: var(--primary); padding: 8px 30px; border-radius: 50px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; background: white; position: absolute; left: 50%; transform: translateX(-50%); z-index: 1; box-shadow: 0 4px 10px rgba(201, 25, 25, 0.1); }

        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .side-nav { position: fixed; top: 0; left: -100%; width: var(--sidebar-width); height: 100vh; background: white; z-index: 2001; transition: left 0.4s ease; display: flex; flex-direction: column; padding: 20px; box-shadow: 10px 0 30px rgba(0,0,0,0.1); }
        .side-nav.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .sidebar-title { font-weight: 800; color: var(--primary); font-size: 20px; }
        .sidebar-close { font-size: 24px; color: #888; cursor: pointer; }
        
        .nav-item { display: flex; align-items: center; text-decoration: none; color: var(--primary); background: white; width: 100%; padding: 14px 20px; margin-bottom: 15px; border: 2px solid #eee; border-radius: 12px; transition: all 0.2s; font-weight: 700; text-transform: uppercase; font-size: 14px; }
        .nav-item:hover { border-color: var(--primary); background: #fff5f5; transform: translateX(5px); }
        .nav-icon-box { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-right: 15px; font-size: 20px; }

        /* --- Container --- */
        .app-shell { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px; padding-top: calc(var(--header-height) + 30px); }
        
        .top-action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .page-title { font-size: 18px; font-weight: 800; color: #333; text-transform: uppercase; letter-spacing: 1px; }
        
        .btn-external { display: inline-flex; align-items: center; gap: 8px; background: white; color: var(--primary); border: 2px solid var(--primary); padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 13px; text-decoration: none; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-external:hover { background: var(--primary); color: white; }

        /* --- Iframe Wrapper --- */
        .iframe-wrapper {
            width: 100%;
            height: calc(100vh - 200px); /* Responsive height */
            min-height: 500px;
            background: white;
            border-radius: 16px;
            border: 2px solid #e5e7eb;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading Overlay untuk Iframe */
        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; transition: opacity 0.5s ease;
            pointer-events: none; /* Biar gak nutupin klik kalau gagal ilang */
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Status Melayang di Pojok Kanan Bawah */
        .server-status-floating { position: fixed; bottom: 20px; right: 20px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); padding: 8px 16px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-size: 12px; font-weight: 700; color: #333; display: flex; align-items: center; gap: 8px; z-index: 2000; border: 1px solid #eee; transition: all 0.3s ease; }
        .status-dot { display: inline-block; width: 8px; height: 8px; background: #10b981; border-radius: 50%; margin-right: 2px; box-shadow: 0 0 8px #10b981; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- OVERLAY & SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <nav class="side-nav" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">AKG Maintenance</span>
            <div class="sidebar-close" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></div>
        </div>
        <a href="index.html" id="nav-home" class="nav-item"><div class="nav-icon-box"><i class="fa-solid fa-house"></i></div><span>Home</span></a>
        <a href="menu_utama.html" id="nav-menu" class="nav-item"><div class="nav-icon-box"><i class="fa-solid fa-table-cells-large"></i></div><span>Menu Utama</span></a>
        <a href="download_data.html" class="nav-item"><div class="nav-icon-box"><i class="fa-solid fa-cloud-arrow-down"></i></div><span>Unduh Data</span></a>
        <a href="informasi_akun.html" class="nav-item"><div class="nav-icon-box"><i class="fa-solid fa-user"></i></div><span>Akun</span></a>
    </nav>

    <!-- HEADER UTAMA -->
    <header class="main-header">
        <div class="header-content-wrapper">
            <div class="hamburger-menu" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
            <div class="header-title-pill">ARSIP LAPORAN</div>
        </div>
    </header>

    <div class="app-shell">
        <div class="top-action-bar" style="justify-content: flex-end;">
            <!-- LINK INI BUAT JAGA-JAGA KALAU IFRAME ERROR DI HP BOS -->
            <a href="https://generic-karol-translucently.ngrok-free.dev" target="_blank" class="btn-external">
                Buka di Tab Baru <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
        </div>

        <div class="iframe-wrapper">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <p style="font-weight: 700; color: #c91919;">Menghubungkan ke Server PC...</p>
                <p style="font-size: 11px; color: #888; margin-top: 5px;">Pastikan PC Admin menyala</p>
            </div>
            
            <!-- INI DIA JENDELA TEMBUS PANDANGNYA -->
            <!-- src nya arahin ke link ngrok permanen lu -->
            <iframe 
                src="https://generic-karol-translucently.ngrok-free.dev" 
                onload="hideLoading()"
                onerror="showError()">
            </iframe>
        </div>
    </div>

    <!-- Floating Connected Status -->
    <div class="server-status-floating" id="connectionStatus">
        <span class="status-dot"></span> Connected
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // Hilangin loading kalau iframe udah selesai dimuat
        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
        }

        // Kalau server mati
        function showError() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.innerHTML = `
                <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: #dc2626; margin-bottom: 15px;"></i>
                <p style="font-weight: 800; color: #dc2626;">KONEKSI TERPUTUS</p>
                <p style="font-size: 12px; color: #666; margin-top: 5px; text-align: center; padding: 0 20px;">
                    PC Server Lokal sedang offline atau terowongan Ngrok terputus.
                </p>
            `;
            
            // Ubah status jadi Disconnected warna merah
            const statusBadge = document.getElementById('connectionStatus');
            if(statusBadge) {
                statusBadge.innerHTML = `<span class="status-dot" style="background:#dc2626; box-shadow: 0 0 8px #dc2626;"></span> Disconnected`;
            }
        }

        // Supabase Initialization untuk Dynamic Routing
        const SUPABASE_URL = 'https://dsyvlavphvrdidmodokd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzeXZsYXZwaHZyZGlkbW9kb2tkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYyNzI5NjMsImV4cCI6MjA4MTg0ODk2M30.mLmyZMUPtCaQl5Vck-Y7nImDFQuVWN_Mk6PrE-miP2E';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function setupDynamicNavigation() {
            try {
                const { data: { session }, error: sessionError } = await client.auth.getSession();
                if (sessionError || !session) return;

                const { data: profile } = await client.from('profiles').select('jabatan').eq('id', session.user.id).single();
                if (!profile) return;

                const jabatan = profile.jabatan.toUpperCase();
                const navHome = document.getElementById('nav-home');
                const navMenu = document.getElementById('nav-menu');

                let homeLink = 'index.html'; let menuLink = 'menu_utama.html';

                if (jabatan.includes('OPERATOR')) { homeLink = 'OPERATOR_HOME.html'; menuLink = 'MENU_UTAMA_OPERATOR.html'; } 
                else if (jabatan.includes('SUPERVISOR')) { homeLink = 'SUPERVISOR_HOME.html'; menuLink = 'MENU_UTAMA_SUPERVISOR.html'; } 
                else if (jabatan.includes('SUPERINTENDENT')) { homeLink = 'SUPERINTENDENT_HOME.html'; menuLink = 'MENU_UTAMA_SUPERINTENDENT.html'; } 
                else if (jabatan.includes('MANAGER') && !jabatan.includes('JUNIOR')) { homeLink = 'MANAGER_HOME.html'; menuLink = 'MENU_UTAMA_MANAGER.html'; } 
                else if (jabatan.includes('JUNIOR MANAGER PRODUKSI') || jabatan.includes('JM PRODUKSI')) { homeLink = 'JUNIOR_MANAGER_PRODUKSI_HOME.html'; menuLink = 'MENU_UTAMA_JM_PRODUKSI.html'; } 
                else if (jabatan.includes('JUNIOR MANAGER PPIC') || jabatan.includes('JM PPIC')) { homeLink = 'JUNIOR_MANAGER_PPIC_HOME.html'; menuLink = 'MENU_UTAMA_JM_PPIC.html'; }

                if (navHome) navHome.href = homeLink;
                if (navMenu) navMenu.href = menuLink;
                
            } catch (err) { console.error("Error setting up navigation", err); }
        }

        window.onload = setupDynamicNavigation;
    </script>
</body>
</html>
